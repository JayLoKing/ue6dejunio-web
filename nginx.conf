# Behind Traefik the TLS ends upstream, so $scheme is always http here. Pass on the scheme the
# proxy saw, and fall back to ours when nginx is reached directly.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    # Docker's embedded DNS. With a variable in proxy_pass, the API name is resolved per request
    # instead of once at startup, so nginx starts even when the API is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://${API_UPSTREAM};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Preserve /api and Authorization; SSE must not be buffered or cached.
    location /api/ {
        # No URI part: the request path, /api prefix included, reaches the API unchanged.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.mjs$ {
      default_type application/javascript;
      try_files $uri =404;
    }
}
